name: Activity

on:
  schedule:
    - cron: "30 18 * * *" 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update daily log
        run: |
          echo "- $(date -u '+%Y-%m-%d'): Daily development log updated." >> daily-log.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-log.md
          git diff --cached --quiet || git commit -m "chore: update daily development log"
          git push
